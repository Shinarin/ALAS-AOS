name: app

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      # rootfs.tar.xz 是 GHA rootfs 流水线的产物落点，随包构建只在本地做，不算 app 改动
      - '!app/app/src/main/assets/rootfs/**'
      - '.github/workflows/app.yml'
  pull_request:
    paths:
      - 'app/**'
      - '!app/app/src/main/assets/rootfs/**'

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # build-logic GitVersion.kt 用 `git describe --tags --always` 导 versionName，浅克隆必炸
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      # 不打 assembleRelease：release 签名 keystore 走 local.properties 绝对路径，CI 上没有
      - name: Assemble debug
        run: ./gradlew assembleDebug --console=plain

      - name: Dual-source consistency gate
        working-directory: .
        run: |
          # overlay 双源：app assets 侧多 seeds/——rootfs 侧 seeds 是顶层 rootfs/seeds/
          # （且多 deploy.yaml，由 build-rootfs.sh 单独 install），assets 打包布局差异而非漂移，显式排除
          diff -r --exclude=seeds app/app/src/main/assets/alas/overlay rootfs/overlays
          diff -r app/app/src/main/assets/alas/patches rootfs/patches

      # 纯标准库脚本（argparse/re/xml.etree），ubuntu-latest 预装 python3 即可跑
      - name: i18n strings gate
        working-directory: .
        run: python3 app/scripts/check_i18n_strings.py
